[package]
name = "cargo-play"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"

[[bin]]
name = "cgpl"
path = "src/main.rs"

[dependencies]
jiff = { version = "1.0", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
tempfile = "3"
serde = { version = "1", features = ["derive"] }
json5 = "1.3"
anyhow = "1"
sea-orm = { version = "1.1", default-features = false, features = [
    "macros",
    "runtime-tokio",
    "sqlx-sqlite",
    "with-uuid",
] }
tokio = { version = "1", features = [
    "fs",
    "io-util",
    "macros",
    "process",
    "rt",
] }
uuid = { version = "1", features = ["v4"] }
comfy-table = { version = "7.2.2", default-features = false, features = ["tty"] }

[dev-dependencies]
unicode-width = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
