[package]
name = "cargo-play"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"

[dependencies]
jiff = "0.2"
clap = { version = "4.5", features = ["derive"] }
tempfile = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
